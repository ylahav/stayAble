name: stayable
description: StayAble — keep your body able. Home or gym training, planned vs actual.
publish_to: "none"
version: 1.0.2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  audioplayers: ^6.5.1
  plinth_blocks: ^0.2.2
  plinth_charts: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0E6B4F"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0E6B4F"
    theme_color: "#0E6B4F"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/app_icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - pubspec.yaml
    - assets/exercises/
    - assets/sounds/
